name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Tests d'intégration de l'API
        run: |
          node server.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/categories > /dev/null; then
              break
            fi
            sleep 1
          done
          BASE_URL=http://localhost:3000 node test-api.js
